# TEMPORAIRE : diagnostic de la branche feat/editeur, retiré avant la PR.
#
# tools/tester.ps1 s'arrête au premier contrôle en échec. Ici chaque contrôle tourne quoi qu'il arrive, pour lire
# tous les écarts d'un coup (mise en forme, clippy, tests, interface).
name: Diagnostic

on:
  push:
    branches: [feat/editeur]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Rust (la version de rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: "false"

      - name: Paquets de l'interface
        working-directory: interface
        run: npm ci --no-audit --no-fund

      - name: svelte-check
        continue-on-error: true
        working-directory: interface
        run: npm run check

      - name: vitest
        continue-on-error: true
        working-directory: interface
        run: npm test

      - name: Compilation de l'interface
        continue-on-error: true
        working-directory: interface
        run: npm run build

      - name: rustfmt
        continue-on-error: true
        run: cargo fmt --all --check

      - name: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests Rust
        continue-on-error: true
        run: cargo test --workspace --all-features --locked
